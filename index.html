<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Kanban Board</title>
		<link rel="stylesheet" href="./styles/styles.css" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
		/>
	</head>
	<body>
		<div class="container">
			<h1>Kanban Task Board</h1>
		</div>

		<div class="container columns">
			<div class="column">
				<div class="column-title">
					<h3 data-tasks="0">To Do</h3>
					<button data-add><i class="bi bi-plus"></i></button>
				</div>
				<div class="tasks"></div>
			</div>
			<div class="column">
				<div class="column-title">
					<h3 data-tasks="0">In Progress</h3>
					<button data-add><i class="bi bi-plus"></i></button>
				</div>
				<div class="tasks"></div>
			</div>
			<div class="column">
				<div class="column-title">
					<h3 data-tasks="0">For Review</h3>
					<button data-add><i class="bi bi-plus"></i></button>
				</div>
				<div class="tasks"></div>
			</div>
			<div class="column">
				<div class="column-title">
					<h3 data-tasks="0">Done</h3>
					<button data-add><i class="bi bi-plus"></i></button>
				</div>
				<div class="tasks"></div>
			</div>
		</div>

		<dialog class="confirm-modal">
			<form method="dialog">
				<h3>Delete task?</h3>
				<p>You are about to delete the following task:</p>
				<div class="preview"></div>

				<menu>
					<button type="button" id="cancel">Cancel</button>
					<button type="submit" id="confirm">Yes, delete it.</button>
				</menu>
			</form>
		</dialog>
		<script src="script.js" defer></script>
	</body>
</html>
